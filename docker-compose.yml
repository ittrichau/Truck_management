services:
  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
      - ./instance:/app/instance
      - ./logs:/var/log/app
    environment:
      - FLASK_ENV=production
      - FLASK_APP=run:app
      - SECRET_KEY=${SECRET_KEY:?err}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///instance/truck_management.db}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - LOG_FILE=${LOG_FILE:-/var/log/app/app.log}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-https}
      - SEED_DEFAULT_DATA=${SEED_DEFAULT_DATA:-false}
    restart: unless-stopped
