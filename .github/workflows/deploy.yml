name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two production deployments at the same time.
concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-migrations:
    name: Verify migration topology
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Require exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(flask --app run:app db heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | grep -cE '^[0-9a-f]+ \(head\)$' || true)"
          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $head_count." >&2
            exit 1
          fi

  deploy:
    name: Deploy application
    needs: verify-migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy revision to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            export APP_DIR=/opt/truck-management
            export DEPLOY_BRANCH=main
            bash /opt/truck-management/deploy/deploy-vps.sh
